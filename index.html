    resp:['Руководитель L1 — контроль качества, метрики','L1 — тестирование и обратная связь'],
    result:'Работающий MVP L0: бот отвечает на топ-5 вопросов. Первые данные по доле обращений, закрытых на L0.' },
  { t:5, id:'5.3', short:'Расширение L0',              full:'Расширение функционала L0',                            dates:'17.12.2026 — 16.03.2027', s:'2026-12-17', e:'2027-03-16',
    tasks:['Проанализировать результаты MVP: где бот справляется, где нет','Расширить список сценариев с 5 до 15–20 (в т.ч. по УТ11)','Оценить экономический эффект L0 (снижение cost per ticket)'],
    resp:['Руководитель L1 — анализ, план развития'],
    result:'Расширенный L0 с 15–20 сценариями. Измеримое снижение нагрузки на L1.' },

  { t:6, id:'6.1', short:'Обучение L1',                full:'Обучение L1 (УТ11)',                                   dates:'17.04 — 31.05.2026', s:'2026-04-17', e:'2026-05-31',
    tasks:['Провести обучение L1 по работе с УТ11 совместно с L2 (апрель–май 2026)','Ввести систему внутренних разборов кейсов: раз в 2 недели'],
    resp:['Руководитель L1 — оценка, планы развития, проведение разборов','L2 (разработка) — обучение по УТ11'],
    result:'Команда начала подготовку к УТ11. Разборы кейсов введены в регулярный режим.' },
  { t:6, id:'6.2', short:'KPI и режим миграции',       full:'KPI, командные встречи и усиленный режим (миграция УТ11)', dates:'17.09 — 16.12.2026', s:'2026-09-17', e:'2026-12-16',
    tasks:['Внедрить персональные KPI: SLA, CSAT, качество категоризации, наполнение БЗ','Провести серию командных встреч на ключевых этапах миграции'],
    resp:['Руководитель L1 — KPI, командные встречи, управление нагрузкой'],
    result:'KPI внедрены и работают. Команда прошла пиковый период миграции без критического снижения качества.' },
  { t:6, id:'6.3', short:'Планирование на год',        full:'Планирование на год',                                  dates:'17.12.2026 — 16.03.2027', s:'2026-12-17', e:'2027-03-16',
    tasks:['Оценить фактическую нагрузку после стабилизации УТ11 и запуска L0','Подготовить план обучения команды на 2027 год','Провести итоговые 1-on-1 с каждым сотрудником'],
    resp:['Руководитель L1 — анализ нагрузки, план найма, 1-on-1'],
    result:'Обоснованный план развития команды на 2027 год. Каждый сотрудник понимает свои результаты за год и цели на следующий.' },
];

const S0 = new Date('2026-03-17'), E0 = new Date('2027-03-16'), TOTAL = E0 - S0;
function pct(d) { return Math.max(0, Math.min(100, (new Date(d) - S0) / TOTAL * 100)); }
function trkColor(id) { return TRACKS.find(t => t.id === id)?.color || '#888'; }

let active = 0, BAR_PX = 660;

function monthsHtml() {
  const months = [];
  let d = new Date(2026, 2, 1);
  while (d <= E0) { months.push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  const cells = months.map(m => {
    const l = pct(m), nxt = new Date(m.getFullYear(), m.getMonth() + 1, 1), w = Math.min(pct(nxt), 100) - l;
    if (w <= 0) return '';
    return `<div class="month-cell" style="width:${w}%">${m.toLocaleString('ru', { month: 'short' }).replace('.', '')}</div>`;
  }).join('');
  return `<div class="months-row"><div class="month-spacer"></div><div class="months">${cells}</div></div>`;
}

function render() {
  const gantt = document.getElementById('gantt');
  const tracksToShow = active === 0 ? TRACKS : TRACKS.filter(t => t.id === active);
  let html = monthsHtml();

  tracksToShow.forEach((trk, ti) => {
    const stages = STAGES.filter(s => s.t === trk.id);
    if (!stages.length) return;
    const col = trk.color;
    const rowH = 29, totalH = stages.length * rowH - 3;
    const divider = ti > 0 ? `<div style="height:1px;background:#e0ded6;margin:4px 0;margin-left:168px"></div>` : '';

    const stageRows = stages.map(s => {
      const l = pct(s.s), r = pct(s.e), w = Math.max(r - l, 0.8);
      return `<div class="stage-row" onclick="openS('${s.id}')">
        <div class="row-id">${s.id}</div>
        <div class="bar-wrap">
          <div class="bar-bg" style="left:${l}%;width:${w}%;background:${col}"></div>
          <div class="bar-lbl-row" data-lbl="${s.id} · ${s.short}" data-l="${l}" data-r="${r}" style="left:${l}%;width:${w}%">
            <span class="bar-lbl"></span>
          </div>
        </div>
      </div>`;
    }).join('');

    html += `${divider}<div class="track-block">
      <div class="track-label">
        <div class="track-label-inner">
          <div class="track-bar" style="height:${totalH}px;background:${col}"></div>
          <span class="track-name" style="color:${col}">${trk.name}</span>
        </div>
      </div>
      <div class="stages-col">${stageRows}</div>
    </div>`;
  });

  gantt.innerHTML = html;
  requestAnimationFrame(() => {
    const wrap = gantt.querySelector('.bar-wrap');
    if (wrap) BAR_PX = wrap.getBoundingClientRect().width || BAR_PX;
    fitLabels();
  });
}

function fitLabels() {
  document.querySelectorAll('.bar-lbl-row').forEach(row => {
    const l = parseFloat(row.dataset.l), r = parseFloat(row.dataset.r);
    const barW = (r - l) / 100 * BAR_PX;
    const lbl = row.dataset.lbl;
    const span = row.querySelector('.bar-lbl');
    const PAD = 14, ctx = getCtx();
    if (ctx.measureText(lbl).width + PAD <= barW) { span.textContent = lbl; return; }
    const dot = lbl.indexOf(' · '), prefix = dot >= 0 ? lbl.slice(0, dot + 3) : '', name = dot >= 0 ? lbl.slice(dot + 3) : lbl;
    let out = '';
    for (let i = name.length; i >= 0; i--) {
      const c = i < name.length ? prefix + name.slice(0, i) + '…' : prefix + name;
      if (ctx.measureText(c).width + PAD <= barW) { out = c; break; }
    }
    if (!out) { const id = lbl.split(' ')[0]; out = ctx.measureText(id).width + PAD <= barW ? id : ''; }
    span.textContent = out;
  });
}

let _ctx = null;
function getCtx() {
  if (!_ctx) { const c = document.createElement('canvas'); _ctx = c.getContext('2d'); _ctx.font = '600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'; }
  return _ctx;
}

function buildTabs() {
  const all = [{ id: 0, name: 'Все треки', color: '#888' }, ...TRACKS];
  document.getElementById('tabs').innerHTML = all.map(t =>
    `<button class="tab${t.id === active ? ' active' : ''}"
      style="${t.id === active ? 'background:' + t.color + ';border-color:' + t.color : ''}"
      onclick="setTrack(${t.id})">${t.id === 0 ? t.name : t.id + '. ' + t.name}</button>`
  ).join('');
}

function setTrack(id) { active = id; buildTabs(); render(); }

function openS(id) {
  const s = STAGES.find(x => x.id === id); if (!s) return;
  const col = trkColor(s.t), tname = TRACKS.find(t => t.id === s.t)?.name || '';
  document.getElementById('m-track').style.color = col;
  document.getElementById('m-track').textContent = `Трек ${s.t} · ${tname}`;
  document.getElementById('m-title').textContent = `Этап ${s.id} — ${s.full}`;
  document.getElementById('m-dates').textContent = s.dates;
  document.getElementById('m-body').innerHTML = `
    <div class="sh">Задачи</div>
    <ul class="task-list">${s.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
    <div class="sh">Ответственные</div>
    ${s.resp.map(r => `<div class="resp-row">${r}</div>`).join('')}
    <div class="sh">Ожидаемый результат</div>
    <div class="result-box">${s.result}</div>
    <button class="close-btn" onclick="closeMod()">Закрыть</button>`;
  document.getElementById('modal-bg').classList.add('open');
}

function closeMod() { document.getElementById('modal-bg').classList.remove('open'); }
document.getElementById('modal-bg').addEventListener('click', e => { if (e.target === document.getElementById('modal-bg')) closeMod(); });

window.addEventListener('resize', () => {
  const w = document.querySelector('.bar-wrap');
  if (w) BAR_PX = w.getBoundingClientRect().width || BAR_PX;
  fitLabels();
});

buildTabs();
render();
</script>
</body>
