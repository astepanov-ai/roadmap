<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог ИТ-услуг · БауСофт 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Golos Text',system-ui,sans-serif;background:#F7F8FA;color:#111827;font-size:14px;line-height:1.5}
.page{max-width:1080px;margin:0 auto;padding:32px 20px 64px}

/* Header */
.header{margin-bottom:24px}
.title{font-size:26px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px}
.subtitle{font-size:12px;color:#9CA3AF;font-family:'JetBrains Mono',monospace}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stat{background:#fff;border:0.5px solid #E4E7EC;border-radius:10px;padding:12px 14px}
.stat-v{font-size:20px;font-weight:600}
.stat-l{font-size:11px;color:#9CA3AF;margin-top:2px}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input{flex:1;min-width:180px;font-size:13px;padding:7px 12px 7px 32px;border:0.5px solid #E4E7EC;border-radius:8px;background:#fff;color:#111827;outline:none;font-family:inherit}
.toolbar input:focus{border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9CA3AF;pointer-events:none}
.pill{font-size:12px;padding:6px 12px;border-radius:20px;border:0.5px solid #E4E7EC;background:#fff;cursor:pointer;color:#6B7280;font-family:inherit;transition:all .15s}
.pill:hover{background:#F3F4F6}
.pill.active{background:#111827;color:#fff;border-color:#111827}
.btn-sm{font-size:12px;padding:6px 12px;border-radius:20px;border:0.5px solid #E4E7EC;background:#fff;cursor:pointer;color:#6B7280;font-family:inherit}
.btn-sm:hover{background:#F3F4F6}

/* Legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:#6B7280}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ─── Level 1: Domain ─────────────────────────────────────── */
.l1{border-radius:12px;overflow:hidden;border:0.5px solid #E4E7EC;background:#fff;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.l1-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;border-left:4px solid transparent;transition:background .12s}
.l1-hdr:hover{background:#FAFBFC}
.l1-icon{font-size:15px;width:24px;text-align:center;flex-shrink:0}
.l1-name{font-size:14px;font-weight:600;flex:1}
.l1-cnt{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.chev{width:14px;height:14px;flex-shrink:0;transition:transform .18s;color:#D1D5DB}
.chev.open{transform:rotate(90deg)}
.l1-body{display:none}
.l1-body.open{display:block}

/* ─── Level 2: Service ────────────────────────────────────── */
.l2{border-top:0.5px solid #F3F4F6}
.l2-hdr{display:flex;align-items:center;gap:8px;padding:10px 16px 10px 24px;cursor:pointer;user-select:none;background:#F9FAFB;transition:background .12s}
.l2-hdr:hover{background:#F3F4F6}
.l2-icon{font-size:13px;width:20px;text-align:center;flex-shrink:0}
.l2-name{font-size:13px;font-weight:500;flex:1}
.tier-badge{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace}
.t1{background:#FEE2E2;color:#991B1B}
.t2{background:#FEF3C7;color:#92400E}
.t3{background:#DBEAFE;color:#1E40AF}
.t4{background:#F3F4F6;color:#374151}
.l2-vol{font-size:11px;color:#9CA3AF;font-family:'JetBrains Mono',monospace}
.l2-body{display:none}
.l2-body.open{display:block}

/* ─── Level 3: Category ───────────────────────────────────── */
.l3{border-top:0.5px solid #F3F4F6}
.l3-hdr{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 40px;cursor:pointer;user-select:none;transition:background .12s}
.l3-hdr:hover{background:#FAFBFC}
.l3-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.l3-name{font-size:12px;font-weight:500;flex:1}
.l3-cnt-badge{font-size:10px;color:#9CA3AF}
.l3-body{display:none;padding:4px 0 8px 0}
.l3-body.open{display:block}

/* ─── Level 4: Subtype row ────────────────────────────────── */
.l4-row{display:flex;align-items:flex-start;gap:10px;padding:6px 16px 6px 56px;border-bottom:0.5px solid #F9FAFB;transition:background .1s}
.l4-row:last-child{border-bottom:none}
.l4-row:hover{background:#FAFBFC}
.l4-num{font-size:11px;color:#D1D5DB;width:20px;flex-shrink:0;padding-top:1px;text-align:right;font-family:'JetBrains Mono',monospace}
.l4-body{flex:1;min-width:0}
.l4-name{font-size:13px;color:#111827}
.l4-desc{font-size:11px;color:#9CA3AF;margin-top:1px;line-height:1.4}
.kind-badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.k-inc{background:#FEE2E2;color:#991B1B}
.k-rfm{background:#DBEAFE;color:#1E40AF}
.k-rfc{background:#D1FAE5;color:#065F46}
.k-mon{background:#F3F4F6;color:#6B7280}

/* Table header in l2 (no-cat services) */
.types-hdr{display:flex;align-items:center;gap:10px;padding:6px 16px 4px 40px;border-top:0.5px solid #F3F4F6}
.types-hdr span{font-size:10px;color:#D1D5DB;font-weight:500;text-transform:uppercase;letter-spacing:.05em}

.tree{display:flex;flex-direction:column;gap:4px}
.no-results{text-align:center;padding:40px;color:#9CA3AF;font-size:13px;display:none}
.no-results.show{display:block}

@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .l4-row{padding-left:48px}
}
</style>
</head>

const allVols = CATALOG.domains.flatMap(d=>d.services.flatMap(s=>s.types.map(t=>t.v)));
const maxVol = Math.max(...allVols);

let activeKind = 'all';

function chevSVG(id){
  return `<svg class="chev" id="chev-${id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`;
}

function toggle(bodyId, chevId){
  const b = document.getElementById(bodyId);
  const c = document.getElementById(chevId);
  if(!b) return;
  b.classList.toggle('open');
  if(c) c.classList.toggle('open');
}

function render(){
  const q = document.getElementById('search').value.toLowerCase().trim();
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  let anyVisible = false;

  CATALOG.domains.forEach((dom, di) => {
    const domId = `dom-${di}`;
    let domHTML = '';
    let domVisible = false;

    dom.services.forEach((svc, si) => {
      const svcId = `svc-${di}-${si}`;

      // Group types by cat
      const bycat = {};
      svc.types.forEach(t => {
        const c = t.cat || '';
        if(!bycat[c]) bycat[c] = [];
        bycat[c].push(t);
      });
      const hasCats = Object.keys(bycat).some(c => c !== '');

      let svcInner = '';
      let svcVisible = false;
      let catIdx = 0;

      Object.entries(bycat).forEach(([cat, catTypes]) => {
        // Filter by kind and query
        const filtered = catTypes.filter(t => {
          const kOk = activeKind === 'all' || t.k === activeKind;
          const qOk = !q
            || t.n.toLowerCase().includes(q)
            || (t.d && t.d.toLowerCase().includes(q))
            || (cat && cat.toLowerCase().includes(q))
            || svc.name.toLowerCase().includes(q)
            || dom.name.toLowerCase().includes(q);
          return kOk && qOk;
        });
        if(!filtered.length) return;

        svcVisible = true;
        const catId = `cat-${di}-${si}-${catIdx}`;

        if(hasCats && cat){
          // Level 3: category header (collapsible)
          const rows = filtered.map((t, ti) => {
            return `<div class="l4-row">
              <span class="l4-num">${ti+1}</span>
              <div class="l4-body">
                <div class="l4-name">${t.n}</div>
                ${t.d ? `<div class="l4-desc">${t.d}</div>` : ''}
              </div>
              <span class="kind-badge ${kindCls[t.k]}">${kindShort[t.k]}</span>
            </div>`;
          }).join('');

          svcInner += `
            <div class="l3">
              <div class="l3-hdr" onclick="toggle('l3b-${catId}','chev-l3-${catId}')">
                <span class="l3-dot" style="background:${dom.color}"></span>
                <span class="l3-name">${cat}</span>
                <span class="l3-cnt-badge">${filtered.length} подтипа</span>
                ${chevSVG('l3-'+catId)}
              </div>
              <div class="l3-body" id="l3b-${catId}">${rows}</div>
            </div>`;
        } else {
          // No category: show types directly under service
          svcInner += `<div class="types-hdr"><span>Вид обращения</span><span style="flex:1"></span><span>Тип задачи</span></div>`;
          filtered.forEach((t, ti) => {
            svcInner += `<div class="l4-row">
              <span class="l4-num">${ti+1}</span>
              <div class="l4-body">
                <div class="l4-name">${t.n}</div>
                ${t.d ? `<div class="l4-desc">${t.d}</div>` : ''}
              </div>
              <span class="kind-badge ${kindCls[t.k]}">${kindShort[t.k]}</span>
            </div>`;
          });
        }
        catIdx++;
      });

      if(!svcVisible) return;
      domVisible = true;

      domHTML += `
        <div class="l2" id="${svcId}">
          <div class="l2-hdr" onclick="toggle('l2b-${svcId}','chev-${svcId}')">
            <span class="l2-icon">${svc.icon}</span>
            <span class="l2-name">${svc.name}</span>
            <span class="tier-badge ${tierCls[svc.tier]}">Tier ${svc.tier}</span>
            
            ${chevSVG(svcId)}
          </div>
          <div class="l2-body" id="l2b-${svcId}">${svcInner}</div>
        </div>`;
    });

    if(!domVisible) return;
    anyVisible = true;

    const domEl = document.createElement('div');
    domEl.className = 'l1';
    domEl.innerHTML = `
      <div class="l1-hdr" style="border-left-color:${dom.color}" onclick="toggle('l1b-${domId}','chev-${domId}')">
        <span class="l1-icon">${dom.icon}</span>
        <span class="l1-name" style="color:${dom.color}">${dom.name}</span>
        <span class="l1-cnt" style="background:${dom.bg};color:${dom.color}">${dom.services.length} услуг</span>
        ${chevSVG(domId)}
      </div>
      <div class="l1-body" id="l1b-${domId}">${domHTML}</div>`;
    tree.appendChild(domEl);
  });

  document.getElementById('no-results').classList.toggle('show', !anyVisible);
}

// Filter pills
document.querySelectorAll('.pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeKind = btn.dataset.kind;
    render();
  });
});

document.getElementById('search').addEventListener('input', render);

document.getElementById('btn-expand').addEventListener('click', () => {
  render();
  setTimeout(() => {
    document.querySelectorAll('.l1-body,.l2-body,.l3-body').forEach(e => e.classList.add('open'));
    document.querySelectorAll('.chev').forEach(e => e.classList.add('open'));
  }, 10);
});

document.getElementById('btn-collapse').addEventListener('click', () => {
  document.querySelectorAll('.l1-body,.l2-body,.l3-body').forEach(e => e.classList.remove('open'));
  document.querySelectorAll('.chev').forEach(e => e.classList.remove('open'));
});

render();
</script>
</body>
</html>
